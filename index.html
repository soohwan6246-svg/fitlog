<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>IRON LOG - 운동 기록 & Gemini 코칭</title>
  <!-- Tailwind CSS CDN (별도 설치 불필요) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 모바일 터치 최적화 및 스크롤바 숨김 */
    body { -webkit-tap-highlight-color: transparent; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex justify-center font-sans select-none">

  <!-- 메인 모바일 래퍼 -->
  <div class="w-full max-w-md bg-zinc-900 min-h-screen flex flex-col border-x border-zinc-800 relative shadow-2xl pb-28">

    <!-- 상단 헤더 -->
    <header class="px-5 pt-5 pb-3 sticky top-0 bg-zinc-900/95 backdrop-blur-md z-30 border-b border-zinc-800">
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <span class="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-pulse"></span>
          <h1 class="text-lg font-black tracking-tight text-white flex items-center gap-1.5">
            IRON LOG <span class="text-[10px] px-2 py-0.5 rounded-full bg-cyan-950 text-cyan-400 border border-cyan-800">PRO</span>
          </h1>
        </div>

        <!-- 실시간 스톱워치 -->
        <div class="flex items-center space-x-2 bg-zinc-950 px-3 py-1 rounded-full border border-zinc-800">
          <svg class="w-4 h-4 text-cyan-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <circle cx="12" cy="12" r="9" stroke-width="2" />
            <path stroke-width="2" stroke-linecap="round" d="M12 7v5l3 3" />
          </svg>
          <span id="timer-display" class="font-mono text-sm font-bold text-zinc-200">00:00</span>
        </div>
      </div>

      <!-- 상단 탭 전환 -->
      <div class="grid grid-cols-2 gap-2 mt-4 bg-zinc-950 p-1 rounded-xl border border-zinc-800">
        <button id="tab-workout-btn" onclick="switchTab('workout')" class="py-2 text-xs font-extrabold rounded-lg transition bg-cyan-500 text-zinc-950 flex items-center justify-center gap-1.5 shadow">
          오늘 운동 기록
        </button>
        <button id="tab-history-btn" onclick="switchTab('history')" class="py-2 text-xs font-bold rounded-lg transition text-zinc-400 hover:text-white flex items-center justify-center gap-1.5">
          운동 일지 (<span id="history-count">0</span>)
        </button>
      </div>
    </header>

    <!-- 탭 1: 오늘 운동 작성 화면 -->
    <main id="view-workout" class="p-4 space-y-4 flex-1">
      <!-- 총 볼륨 카드 -->
      <div class="bg-gradient-to-br from-zinc-800/80 to-zinc-900 border border-zinc-700/60 rounded-2xl p-4 flex items-center justify-between shadow-lg">
        <div>
          <p class="text-xs text-zinc-400 font-medium">완료 총 볼륨</p>
          <div class="flex items-baseline space-x-1.5 mt-0.5">
            <span id="total-volume-display" class="text-2xl font-black text-emerald-400 tracking-tight">0</span>
            <span class="text-xs font-bold text-zinc-400">kg</span>
          </div>
        </div>
        <button onclick="openGeminiModal()" class="flex items-center gap-1.5 px-3 py-2 rounded-xl bg-cyan-950 text-cyan-300 border border-cyan-800/80 hover:bg-cyan-900 text-xs font-bold transition shadow-sm">
          <svg class="w-4 h-4 text-cyan-400" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 2L14.4 7.6L20 10L14.4 12.4L12 18L9.6 12.4L4 10L9.6 7.6L12 2Z" />
          </svg>
          Gemini 피드백
        </button>
      </div>

      <!-- 운동 카드 렌더링 영역 -->
      <div id="exercise-list-container" class="space-y-4"></div>

      <!-- 운동 종목 추가 버튼 -->
      <button onclick="openExerciseModal()" class="w-full py-3.5 rounded-2xl bg-zinc-900 border border-dashed border-zinc-700 text-zinc-300 font-bold text-xs hover:border-cyan-500 hover:text-cyan-400 transition flex items-center justify-center gap-2">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-width="2" stroke-linecap="round" d="M12 4v16m8-8H4" />
        </svg>
        새 운동 종목 추가하기
      </button>
    </main>

    <!-- 탭 2: 운동 일지 (히스토리) 화면 -->
    <main id="view-history" class="p-4 space-y-4 flex-1 hidden">
      <div class="flex items-center justify-between pb-1">
        <h2 class="text-sm font-bold text-zinc-300">누적 운동 기록</h2>
        <span class="text-[11px] text-zinc-500">기록이 브라우저에 안전히 보관됩니다</span>
      </div>
      <div id="history-list-container" class="space-y-3"></div>
    </main>

    <!-- 플로팅 휴식 타이머 바 -->
    <div id="rest-timer-bar" class="fixed bottom-24 left-1/2 -translate-x-1/2 w-full max-w-md px-4 z-40 hidden">
      <div class="bg-cyan-950/95 border border-cyan-500/60 backdrop-blur-md rounded-2xl p-3 shadow-2xl flex items-center justify-between">
        <div class="flex items-center space-x-3">
          <div class="w-8 h-8 rounded-full bg-cyan-500/20 flex items-center justify-center text-cyan-400 font-bold">
            ⏳
          </div>
          <div>
            <p class="text-[11px] text-cyan-300 font-bold">휴식 중</p>
            <p id="rest-countdown" class="font-mono text-lg font-black text-white">60초 남음</p>
          </div>
        </div>
        <div class="flex items-center space-x-1.5">
          <button onclick="addRestTime(30)" class="px-2.5 py-1.5 rounded-lg bg-cyan-900 text-cyan-200 text-xs font-bold hover:bg-cyan-800">
            +30초
          </button>
          <button onclick="stopRestTimer()" class="px-2.5 py-1.5 rounded-lg bg-zinc-800 text-zinc-300 text-xs font-bold hover:bg-zinc-700">
            건너뛰기
          </button>
        </div>
      </div>
    </div>

    <!-- 하단 고정 완료 버튼 -->
    <footer id="bottom-action-footer" class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md p-4 bg-zinc-900/90 backdrop-blur-md border-t border-zinc-800 z-30">
      <button onclick="finishAndSaveWorkout()" class="w-full py-4 rounded-2xl bg-cyan-500 hover:bg-cyan-400 text-zinc-950 font-black text-sm shadow-lg shadow-cyan-500/20 active:scale-[0.98] transition flex items-center justify-center gap-2">
        <svg class="w-5 h-5 stroke-[2.5]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
        </svg>
        오늘 운동 완료하고 일지에 저장
      </button>
    </footer>

    <!-- 모달 1: 운동 종목 선택 -->
    <div id="exercise-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center hidden">
      <div class="w-full max-w-md bg-zinc-900 border border-zinc-800 rounded-t-3xl sm:rounded-3xl max-h-[85vh] flex flex-col overflow-hidden">
        <div class="p-4 border-b border-zinc-800 space-y-3">
          <div class="flex items-center justify-between">
            <h3 class="font-black text-white text-base">운동 추가하기</h3>
            <button onclick="closeExerciseModal()" class="text-zinc-500 hover:text-white text-lg p-1">✕</button>
          </div>
          <!-- 검색 인풋 -->
          <input type="text" id="exercise-search-input" oninput="renderExercisePickerList()" placeholder="운동 종목 검색 (예: 벤치 프레스, 스쿼트)" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2.5 text-xs text-white placeholder-zinc-500 focus:outline-none focus:border-cyan-500">
          
          <!-- 태그 필터 -->
          <div class="flex gap-1.5 overflow-x-auto pb-1 text-xs no-scrollbar">
            <button onclick="setFilterPart('전체')" class="filter-chip px-3 py-1 rounded-full font-bold bg-cyan-500 text-zinc-950" data-part="전체">전체</button>
            <button onclick="setFilterPart('가슴')" class="filter-chip px-3 py-1 rounded-full font-bold bg-zinc-800 text-zinc-400" data-part="가슴">가슴</button>
            <button onclick="setFilterPart('등')" class="filter-chip px-3 py-1 rounded-full font-bold bg-zinc-800 text-zinc-400" data-part="등">등</button>
            <button onclick="setFilterPart('어깨')" class="filter-chip px-3 py-1 rounded-full font-bold bg-zinc-800 text-zinc-400" data-part="어깨">어깨</button>
            <button onclick="setFilterPart('하체')" class="filter-chip px-3 py-1 rounded-full font-bold bg-zinc-800 text-zinc-400" data-part="하체">하체</button>
            <button onclick="setFilterPart('팔')" class="filter-chip px-3 py-1 rounded-full font-bold bg-zinc-800 text-zinc-400" data-part="팔">팔</button>
          </div>
        </div>
        <div id="exercise-picker-container" class="flex-1 overflow-y-auto p-4 space-y-2"></div>
      </div>
    </div>

    <!-- 모달 2: Gemini 프롬프트 생성기 -->
    <div id="gemini-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
      <div class="w-full max-w-md bg-zinc-900 border border-zinc-800 rounded-3xl max-h-[90vh] flex flex-col overflow-hidden">
        <div class="p-4 border-b border-zinc-800 flex items-center justify-between">
          <div class="flex items-center gap-2">
            <div class="w-6 h-6 rounded-lg bg-gradient-to-tr from-cyan-500 to-blue-500 flex items-center justify-center text-zinc-950 font-black text-xs">G</div>
            <h3 class="font-black text-white text-base">Gemini 운동 분석 프롬프트</h3>
          </div>
          <button onclick="closeGeminiModal()" class="text-zinc-500 hover:text-white text-lg p-1">✕</button>
        </div>

        <div class="p-4 overflow-y-auto space-y-4 text-xs">
          <div>
            <label class="font-bold text-zinc-400 block mb-2">코칭 페르소나 선택</label>
            <div class="grid grid-cols-3 gap-2">
              <button onclick="setPersona('coach')" id="persona-coach" class="persona-btn p-2 rounded-xl border bg-cyan-950 border-cyan-500 text-left">
                <p class="font-bold text-white">🔥 관장님</p>
                <p class="text-[10px] text-zinc-400 mt-0.5">빡센 증량 조언</p>
              </button>
              <button onclick="setPersona('science')" id="persona-science" class="persona-btn p-2 rounded-xl border bg-zinc-950 border-zinc-800 text-left">
                <p class="font-bold text-zinc-300">🩺 스포츠과학</p>
                <p class="text-[10px] text-zinc-500 mt-0.5">볼륨·해부학 분석</p>
              </button>
              <button onclick="setPersona('friend')" id="persona-friend" class="persona-btn p-2 rounded-xl border bg-zinc-950 border-zinc-800 text-left">
                <p class="font-bold text-zinc-300">💪 헬스메이트</p>
                <p class="text-[10px] text-zinc-500 mt-0.5">칭찬과 동기부여</p>
              </button>
            </div>
          </div>

          <div>
            <div class="flex items-center justify-between mb-1.5">
              <span class="font-bold text-zinc-400">자동 완성된 프롬프트</span>
              <span class="text-[10px] text-cyan-400">복사해서 제미나이에 붙여넣기만 하면 끝!</span>
            </div>
            <textarea id="gemini-prompt-text" rows="8" readonly class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 font-mono text-[11px] text-zinc-300 focus:outline-none resize-none"></textarea>
          </div>

          <button onclick="copyGeminiPrompt()" class="w-full py-3 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-zinc-950 font-black text-xs transition flex items-center justify-center gap-1.5 shadow">
            📋 프롬프트 복사하기
          </button>
        </div>
      </div>
    </div>

    <!-- 토스트 알림 플로팅 -->
    <div id="toast-box" class="fixed top-6 left-1/2 -translate-x-1/2 bg-zinc-800 text-white border border-zinc-700 text-xs font-bold px-4 py-2.5 rounded-full shadow-2xl z-50 transition-all opacity-0 pointer-events-none duration-300">
      알림 메시지
    </div>

  </div>

  <!-- 인라인 스크립트 (외부 의존성 제로, 완전 자체 실행) -->
  <script>
    // --- 기본 운동 DB ---
    const DB_EXERCISES = [
      { id: 'machine_chest_press', name: '머신 체스트 프레스', target: '대흉근', category: '머신', bodyPart: '가슴' },
      { id: 'bench_press', name: '벤치 프레스', target: '대흉근 전반', category: '바벨', bodyPart: '가슴' },
      { id: 'incline_db_press', name: '인클라인 덤벨 프레스', target: '상부 흉근', category: '덤벨', bodyPart: '가슴' },
      { id: 'lat_pulldown', name: '랫 풀 다운', target: '광배근', category: '머신', bodyPart: '등' },
      { id: 'cable_seated_row', name: '케이블 시티드 로우', target: '광배근/승모근', category: '케이블', bodyPart: '등' },
      { id: 'deadlift', name: '컨벤셔널 데드리프트', target: '전신 후면 사슬', category: '바벨', bodyPart: '등' },
      { id: 'db_lateral_raise', name: '덤벨 사이드 레터럴 레이즈', target: '측면 삼각근', category: '덤벨', bodyPart: '어깨' },
      { id: 'overhead_press', name: '오버헤드 프레스', target: '전면/측면 삼각근', category: '바벨', bodyPart: '어깨' },
      { id: 'squat', name: '바벨 백스쿼트', target: '대퇴사두/둔근', category: '바벨', bodyPart: '하체' },
      { id: 'leg_press', name: '레그 프레스', target: '하체 전반', category: '머신', bodyPart: '하체' },
      { id: 'cable_pushdown', name: '케이블 푸시 다운', target: '삼두근', category: '케이블', bodyPart: '팔' },
      { id: 'barbell_curl', name: '바벨 컬', target: '이두근', category: '바벨', bodyPart: '팔' }
    ];

    // --- 앱 상태 ---
    let state = {
      activeTab: 'workout',
      timerSeconds: 0,
      timerRunning: true,
      restSeconds: 0,
      selectedPersona: 'coach',
      filterPart: '전체',
      activeSession: null,
      history: []
    };

    // 로컬 스토리지 키
    const STORAGE_ACTIVE = 'iron_active_workout_v1';
    const STORAGE_HIST = 'iron_history_v1';

    // 초기화
    function initApp() {
      // 히스토리 불러오기
      try {
        const histSaved = localStorage.getItem(STORAGE_HIST);
        state.history = histSaved ? JSON.parse(histSaved) : [
          {
            id: 'sample_1',
            date: '2026-10-18 (일)',
            duration: '48:20',
            totalVolume: 1350,
            exercises: [
              {
                name: '머신 체스트 프레스',
                sets: [
                  { weight: 35, reps: 12, completed: true },
                  { weight: 40, reps: 12, completed: true },
                  { weight: 45, reps: 10, completed: true }
                ]
              }
            ]
          }
        ];
      } catch (e) { state.history = []; }

      // 진행 중인 운동 불러오기 (없으면 기본 머신 체스트 프레스 1개 세팅)
      try {
        const activeSaved = localStorage.getItem(STORAGE_ACTIVE);
        if (activeSaved) {
          state.activeSession = JSON.parse(activeSaved);
        } else {
          state.activeSession = {
            durationSeconds: 0,
            exercises: [
              {
                instanceId: 'inst_' + Date.now(),
                id: 'machine_chest_press',
                name: '머신 체스트 프레스',
                category: '머신',
                sets: [
                  { weight: 35, reps: 12, completed: true },
                  { weight: 40, reps: 12, completed: true },
                  { weight: 45, reps: 10, completed: false },
                  { weight: 45, reps: 10, completed: false }
                ]
              }
            ]
          };
        }
      } catch (e) {
        state.activeSession = { durationSeconds: 0, exercises: [] };
      }

      state.timerSeconds = state.activeSession.durationSeconds || 0;

      // 스톱워치 가동
      setInterval(() => {
        if (state.timerRunning) {
          state.timerSeconds++;
          state.activeSession.durationSeconds = state.timerSeconds;
          document.getElementById('timer-display').innerText = formatTime(state.timerSeconds);
          // 5초마다 자동 저장
          if (state.timerSeconds % 5 === 0) saveActiveSession();
        }
      }, 1000);

      // 렌더링
      updateHistoryCount();
      renderActiveWorkout();
      renderHistoryList();
    }

    // 시간 포맷 (초 -> MM:SS)
    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    // 로컬 스토리지 저장
    function saveActiveSession() {
      localStorage.setItem(STORAGE_ACTIVE, JSON.stringify(state.activeSession));
    }
    function saveHistory() {
      localStorage.setItem(STORAGE_HIST, JSON.stringify(state.history));
      updateHistoryCount();
    }
    function updateHistoryCount() {
      document.getElementById('history-count').innerText = state.history.length;
    }

    // 탭 전환
    function switchTab(tab) {
      state.activeTab = tab;
      const workoutView = document.getElementById('view-workout');
      const historyView = document.getElementById('view-history');
      const footer = document.getElementById('bottom-action-footer');
      const tabWBtn = document.getElementById('tab-workout-btn');
      const tabHBtn = document.getElementById('tab-history-btn');

      if (tab === 'workout') {
        workoutView.classList.remove('hidden');
        historyView.classList.add('hidden');
        footer.classList.remove('hidden');
        tabWBtn.className = 'py-2 text-xs font-extrabold rounded-lg transition bg-cyan-500 text-zinc-950 flex items-center justify-center gap-1.5 shadow';
        tabHBtn.className = 'py-2 text-xs font-bold rounded-lg transition text-zinc-400 hover:text-white flex items-center justify-center gap-1.5';
      } else {
        workoutView.classList.add('hidden');
        historyView.classList.remove('hidden');
        footer.classList.add('hidden');
        tabHBtn.className = 'py-2 text-xs font-extrabold rounded-lg transition bg-cyan-500 text-zinc-950 flex items-center justify-center gap-1.5 shadow';
        tabWBtn.className = 'py-2 text-xs font-bold rounded-lg transition text-zinc-400 hover:text-white flex items-center justify-center gap-1.5';
        renderHistoryList();
      }
    }

    // 지난 기록 검색 (점진적 과부하 힌트)
    function getLastPerformance(exerciseId) {
      for (const h of state.history) {
        const found = h.exercises.find(e => e.name === exerciseId || e.id === exerciseId);
        if (found && found.sets) {
          const comp = found.sets.filter(s => s.completed);
          if (comp.length > 0) {
            const best = comp.reduce((prev, cur) => cur.weight > prev.weight ? cur : prev, comp[0]);
            return `지난번: ${best.weight}kg × ${best.reps}회`;
          }
        }
      }
      return '첫 도전 종목';
    }

    // 운동 세션 화면 렌더링
    function renderActiveWorkout() {
      const container = document.getElementById('exercise-list-container');
      container.innerHTML = '';

      let totalVolume = 0;

      if (state.activeSession.exercises.length === 0) {
        container.innerHTML = `
          <div class="text-center py-16 border border-dashed border-zinc-800 rounded-2xl p-6">
            <p class="text-zinc-400 text-sm font-medium">추가된 운동이 없습니다.</p>
            <p class="text-zinc-600 text-xs mt-1">아래 [새 운동 종목 추가하기]를 눌러보세요!</p>
          </div>
        `;
      }

      state.activeSession.exercises.forEach((ex, exIdx) => {
        const card = document.createElement('div');
        card.className = 'bg-zinc-900 border border-zinc-800 rounded-2xl p-4 shadow-sm';

        // 볼륨 계산
        ex.sets.forEach(s => {
          if (s.completed) totalVolume += (Number(s.weight) || 0) * (Number(s.reps) || 0);
        });

        // 세트 행 생성
        let setRowsHtml = '';
        ex.sets.forEach((set, sIdx) => {
          setRowsHtml += `
            <div class="grid grid-cols-12 items-center py-2 px-1 rounded-xl text-center transition ${set.completed ? 'bg-emerald-950/20 border border-emerald-900/40' : 'hover:bg-zinc-800/40'}">
              <span class="col-span-2 font-mono font-bold text-zinc-400 text-sm">${sIdx + 1}</span>
              
              <!-- 무게 조절 -->
              <div class="col-span-4 flex items-center justify-center space-x-1">
                <button onclick="changeSetValue(${exIdx}, ${sIdx}, 'weight', -5)" class="w-6 h-6 rounded bg-zinc-800 text-zinc-400 font-bold hover:bg-zinc-700">-</button>
                <span class="font-mono font-bold text-white text-sm w-9 text-center">${set.weight}</span>
                <button onclick="changeSetValue(${exIdx}, ${sIdx}, 'weight', 5)" class="w-6 h-6 rounded bg-zinc-800 text-zinc-400 font-bold hover:bg-zinc-700">+</button>
              </div>

              <!-- 횟수 조절 -->
              <div class="col-span-4 flex items-center justify-center space-x-1">
                <button onclick="changeSetValue(${exIdx}, ${sIdx}, 'reps', -1)" class="w-6 h-6 rounded bg-zinc-800 text-zinc-400 font-bold hover:bg-zinc-700">-</button>
                <span class="font-mono font-bold text-white text-sm w-8 text-center">${set.reps}</span>
                <button onclick="changeSetValue(${exIdx}, ${sIdx}, 'reps', 1)" class="w-6 h-6 rounded bg-zinc-800 text-zinc-400 font-bold hover:bg-zinc-700">+</button>
              </div>

              <!-- 체크 완료 -->
              <div class="col-span-2 flex justify-center">
                <button onclick="toggleSetCheck(${exIdx}, ${sIdx})" class="w-7 h-7 rounded-lg flex items-center justify-center transition ${set.completed ? 'bg-emerald-500 text-zinc-950 font-black' : 'bg-zinc-800 border border-zinc-700 text-transparent'}">
                  ✓
                </button>
              </div>
            </div>
          `;
        });

        card.innerHTML = `
          <div class="flex items-start justify-between pb-3 border-b border-zinc-800/60">
            <div>
              <div class="flex items-center gap-2">
                <span class="text-[10px] font-semibold px-2 py-0.5 rounded bg-zinc-800 text-zinc-300">${ex.category}</span>
                <h3 class="font-bold text-white text-base">${ex.name}</h3>
              </div>
              <p class="text-[11px] text-zinc-400 mt-1">💡 ${getLastPerformance(ex.name)}</p>
            </div>
            <button onclick="removeExercise(${exIdx})" class="text-zinc-500 hover:text-red-400 p-1 text-sm">✕</button>
          </div>

          <div class="grid grid-cols-12 text-[11px] font-bold text-zinc-500 pt-3 pb-1 text-center">
            <span class="col-span-2">세트</span>
            <span class="col-span-4">무게 (kg)</span>
            <span class="col-span-4">횟수 (회)</span>
            <span class="col-span-2">완료</span>
          </div>

          <div class="space-y-1.5 mt-1">${setRowsHtml}</div>

          <div class="flex items-center justify-end space-x-2 mt-3 pt-2 border-t border-zinc-800/40">
            <button onclick="removeSet(${exIdx})" class="text-xs px-2.5 py-1 rounded-lg bg-zinc-800 text-zinc-400 hover:bg-zinc-700">- 세트 삭제</button>
            <button onclick="addSet(${exIdx})" class="text-xs px-2.5 py-1 rounded-lg bg-zinc-800 text-cyan-400 hover:bg-zinc-700 font-bold">+ 세트 추가</button>
          </div>
        `;
        container.appendChild(card);
      });

      document.getElementById('total-volume-display').innerText = totalVolume.toLocaleString();
      saveActiveSession();
    }

    // 세트 수치 변경
    function changeSetValue(exIdx, sIdx, field, delta) {
      const cur = state.activeSession.exercises[exIdx].sets[sIdx][field];
      const next = Math.max(field === 'weight' ? 0 : 1, cur + delta);
      state.activeSession.exercises[exIdx].sets[sIdx][field] = next;
      renderActiveWorkout();
    }

    // 세트 완료 토글 & 휴식 타이머 가동
    function toggleSetCheck(exIdx, sIdx) {
      const target = state.activeSession.exercises[exIdx].sets[sIdx];
      target.completed = !target.completed;
      if (target.completed) {
        startRestTimer(60);
        showToast('세트 완료! 60초 휴식 시작');
      }
      renderActiveWorkout();
    }

    // 세트 추가 / 삭제
    function addSet(exIdx) {
      const sets = state.activeSession.exercises[exIdx].sets;
      const last = sets[sets.length - 1];
      sets.push({
        weight: last ? last.weight : 20,
        reps: last ? last.reps : 10,
        completed: false
      });
      renderActiveWorkout();
    }
    function removeSet(exIdx) {
      const sets = state.activeSession.exercises[exIdx].sets;
      if (sets.length > 1) {
        sets.pop();
        renderActiveWorkout();
      }
    }

    // 종목 삭제
    function removeExercise(exIdx) {
      state.activeSession.exercises.splice(exIdx, 1);
      renderActiveWorkout();
      showToast('운동 종목이 삭제되었습니다.');
    }

    // 휴식 타이머 기능
    let restInterval = null;
    function startRestTimer(seconds) {
      clearInterval(restInterval);
      state.restSeconds = seconds;
      const bar = document.getElementById('rest-timer-bar');
      bar.classList.remove('hidden');
      updateRestCountdown();

      restInterval = setInterval(() => {
        state.restSeconds--;
        if (state.restSeconds <= 0) {
          stopRestTimer();
          showToast('⏰ 휴식 종료! 다음 세트 드루와!');
        } else {
          updateRestCountdown();
        }
      }, 1000);
    }
    function updateRestCountdown() {
      document.getElementById('rest-countdown').innerText = state.restSeconds + '초 남음';
    }
    function addRestTime(sec) {
      state.restSeconds += sec;
      updateRestCountdown();
    }
    function stopRestTimer() {
      clearInterval(restInterval);
      document.getElementById('rest-timer-bar').classList.add('hidden');
    }

    // 모달 제어
    function openExerciseModal() {
      document.getElementById('exercise-modal').classList.remove('hidden');
      renderExercisePickerList();
    }
    function closeExerciseModal() {
      document.getElementById('exercise-modal').classList.add('hidden');
    }
    function setFilterPart(part) {
      state.filterPart = part;
      document.querySelectorAll('.filter-chip').forEach(btn => {
        if (btn.getAttribute('data-part') === part) {
          btn.className = 'filter-chip px-3 py-1 rounded-full font-bold bg-cyan-500 text-zinc-950';
        } else {
          btn.className = 'filter-chip px-3 py-1 rounded-full font-bold bg-zinc-800 text-zinc-400';
        }
      });
      renderExercisePickerList();
    }
    function renderExercisePickerList() {
      const q = document.getElementById('exercise-search-input').value.toLowerCase();
      const container = document.getElementById('exercise-picker-container');
      container.innerHTML = '';

      const filtered = DB_EXERCISES.filter(ex => {
        const matchQ = ex.name.toLowerCase().includes(q);
        const matchPart = state.filterPart === '전체' || ex.bodyPart === state.filterPart;
        return matchQ && matchPart;
      });

      filtered.forEach(ex => {
        const item = document.createElement('div');
        item.className = 'p-3 bg-zinc-950 border border-zinc-800/80 rounded-xl hover:border-cyan-500/60 cursor-pointer flex items-center justify-between transition';
        item.onclick = () => {
          state.activeSession.exercises.push({
            instanceId: 'inst_' + Date.now(),
            id: ex.id,
            name: ex.name,
            category: ex.category,
            sets: [
              { weight: 20, reps: 10, completed: false },
              { weight: 20, reps: 10, completed: false },
              { weight: 20, reps: 10, completed: false }
            ]
          });
          closeExerciseModal();
          renderActiveWorkout();
          showToast(`'${ex.name}' 추가 완료!`);
        };
        item.innerHTML = `
          <div>
            <div class="flex items-center gap-2">
              <span class="text-[10px] px-1.5 py-0.5 rounded bg-zinc-800 text-zinc-400 font-medium">${ex.category}</span>
              <span class="font-bold text-sm text-zinc-200">${ex.name}</span>
            </div>
            <p class="text-[11px] text-zinc-500 mt-1">부위: ${ex.bodyPart} · ${ex.target}</p>
          </div>
          <span class="text-xs font-bold text-cyan-400 bg-cyan-950 px-2.5 py-1 rounded-lg border border-cyan-800/40">선택 +</span>
        `;
        container.appendChild(item);
      });
    }

    // 오늘 운동 완료 & 일지 저장
    function finishAndSaveWorkout() {
      if (state.activeSession.exercises.length === 0) {
        showToast('운동 종목을 먼저 추가해주세요.');
        return;
      }

      let totalVolume = 0;
      state.activeSession.exercises.forEach(ex => {
        ex.sets.forEach(s => {
          if (s.completed) totalVolume += (Number(s.weight) || 0) * (Number(s.reps) || 0);
        });
      });

      const now = new Date();
      const days = ['일', '월', '화', '수', '목', '금', '토'];
      const dateStr = `${now.getMonth() + 1}월 ${now.getDate()}일 (${days[now.getDay()]}) ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

      const historyRecord = {
        id: 'hist_' + Date.now(),
        date: dateStr,
        duration: formatTime(state.timerSeconds),
        totalVolume: totalVolume,
        exercises: JSON.parse(JSON.stringify(state.activeSession.exercises))
      };

      state.history.unshift(historyRecord);
      saveHistory();

      // 세션 초기화
      state.timerSeconds = 0;
      state.activeSession = { durationSeconds: 0, exercises: [] };
      saveActiveSession();

      showToast('🎉 오늘 운동이 성공적으로 일지에 저장되었습니다!');
      switchTab('history');
    }

    // 히스토리 화면 렌더링
    function renderHistoryList() {
      const container = document.getElementById('history-list-container');
      container.innerHTML = '';

      if (state.history.length === 0) {
        container.innerHTML = `
          <div class="text-center py-20 border border-zinc-800 rounded-2xl p-6">
            <p class="text-zinc-400 text-sm font-medium">저장된 운동 일지가 없습니다.</p>
            <p class="text-zinc-600 text-xs mt-1">오늘 운동을 마치고 완료 버튼을 누르면 기록돼요!</p>
          </div>
        `;
        return;
      }

      state.history.forEach((h, hIdx) => {
        const item = document.createElement('div');
        item.className = 'bg-zinc-900 border border-zinc-800 rounded-2xl p-4 space-y-3';

        let exListHtml = '';
        h.exercises.forEach(ex => {
          let badgeSets = '';
          ex.sets.forEach(s => {
            badgeSets += `
              <span class="text-[10px] px-2 py-0.5 rounded font-mono ${s.completed ? 'bg-zinc-800 text-zinc-300 border border-zinc-700' : 'bg-zinc-900 text-zinc-600 line-through'}">
                ${s.weight}kg×${s.reps}
              </span>
            `;
          });
          exListHtml += `
            <div class="text-xs">
              <div class="font-bold text-zinc-300 flex items-center justify-between">
                <span>${ex.name}</span>
                <span class="text-[11px] text-zinc-500 font-normal">${ex.sets.length}세트</span>
              </div>
              <div class="flex flex-wrap gap-1.5 mt-1.5">${badgeSets}</div>
            </div>
          `;
        });

        item.innerHTML = `
          <div class="flex items-center justify-between">
            <div>
              <h4 class="font-extrabold text-white text-sm">${h.date}</h4>
              <p class="text-[11px] text-zinc-400 mt-0.5">
                시간: <span class="text-zinc-300 font-mono">${h.duration}</span> · 
                볼륨: <span class="text-emerald-400 font-bold">${h.totalVolume.toLocaleString()} kg</span>
              </p>
            </div>
            <button onclick="deleteHistory(${hIdx})" class="text-zinc-600 hover:text-red-400 p-1 text-xs">삭제</button>
          </div>
          <div class="bg-zinc-950/70 rounded-xl p-3 space-y-2 border border-zinc-800/60">${exListHtml}</div>
        `;
        container.appendChild(item);
      });
    }

    function deleteHistory(idx) {
      if (confirm('이 기록을 삭제하시겠습니까?')) {
        state.history.splice(idx, 1);
        saveHistory();
        renderHistoryList();
        showToast('기록이 삭제되었습니다.');
      }
    }

    // Gemini 모달 & 프롬프트 생성
    function openGeminiModal() {
      document.getElementById('gemini-modal').classList.remove('hidden');
      updateGeminiPromptText();
    }
    function closeGeminiModal() {
      document.getElementById('gemini-modal').classList.add('hidden');
    }
    function setPersona(persona) {
      state.selectedPersona = persona;
      ['coach', 'science', 'friend'].forEach(p => {
        const btn = document.getElementById('persona-' + p);
        if (p === persona) {
          btn.className = 'persona-btn p-2 rounded-xl border bg-cyan-950 border-cyan-500 text-left';
          btn.querySelector('p').className = 'font-bold text-white';
        } else {
          btn.className = 'persona-btn p-2 rounded-xl border bg-zinc-950 border-zinc-800 text-left';
          btn.querySelector('p').className = 'font-bold text-zinc-300';
        }
      });
      updateGeminiPromptText();
    }

    function updateGeminiPromptText() {
      const personas = {
        coach: '너는 20년 경력의 보디빌딩 관장님이야. 빡세고 묵직하지만 정확하게 타겟 부위 자극과 증량 루틴을 피드백해줘.',
        science: '너는 스포츠의학 및 생체역학 전문가야. 해부학적 관점에서 세트 수 볼륨, 근비대 적합성, 관절 과부하를 정밀 분석해줘.',
        friend: '너는 언제나 동기부여를 심어주는 파이팅 넘치는 긍정 헬스 메이트야. 칭찬을 듬뿍 해주고 다음 세션 꿀팁을 전수해줘.'
      };

      let exText = '';
      let vol = 0;
      state.activeSession.exercises.forEach((ex, idx) => {
        exText += `\n${idx + 1}. ${ex.name}:\n`;
        ex.sets.forEach((s, sIdx) => {
          if (s.completed) vol += (Number(s.weight) || 0) * (Number(s.reps) || 0);
          exText += `   - ${sIdx + 1}세트: ${s.weight}kg × ${s.reps}회 ${s.completed ? '(완료)' : '(미완료)'}\n`;
        });
      });

      const prompt = `[역할 설정]\n${personas[state.selectedPersona]}\n\n` +
        `[오늘 수행한 운동 데이터]\n` +
        `- 운동 시간: ${formatTime(state.timerSeconds)}\n` +
        `- 완료 총 볼륨: ${vol.toLocaleString()} kg\n` +
        `- 종목 및 세트 세부 기록:\n${exText || '아직 기록 없음'}\n\n` +
        `[질문 및 요청 사항]\n` +
        `1. 오늘 진행한 볼륨과 운동 강도가 적절했는지 분석해줘.\n` +
        `2. 다음 세션에서 무게(점진적 과부하)를 어떻게 가져가면 좋을지 각 종목별 구체적인 수치를 제안해줘.\n` +
        `3. 운동 직후 최적의 단백질 및 영양 섭취 타이밍과 추천 식단을 알려줘.`;

      document.getElementById('gemini-prompt-text').value = prompt;
    }

    function copyGeminiPrompt() {
      const textarea = document.getElementById('gemini-prompt-text');
      textarea.select();
      navigator.clipboard.writeText(textarea.value);
      showToast('📋 제미나이 프롬프트가 복사되었습니다!');
    }

    // 토스트 도우미
    function showToast(msg) {
      const box = document.getElementById('toast-box');
      box.innerText = msg;
      box.classList.remove('opacity-0', 'pointer-events-none');
      setTimeout(() => {
        box.classList.add('opacity-0', 'pointer-events-none');
      }, 2500);
    }

    // 앱 구동
    initApp();
  </script>
</body>
</html>
