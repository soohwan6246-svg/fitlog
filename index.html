<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FITLOG PRO - 머신 특화 운동 일지 & Gemini AI</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex justify-center font-sans antialiased select-none">

  <!-- 메인 모바일/태블릿 레이아웃 프레임 -->
  <div class="w-full max-w-xl bg-zinc-900 border-x border-zinc-800 min-h-screen flex flex-col relative shadow-2xl pb-32">

    <!-- 상단 헤더 -->
    <header class="px-5 pt-5 pb-3 sticky top-0 bg-zinc-900/95 backdrop-blur-md z-30 border-b border-zinc-800">
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <div class="w-7 h-7 rounded-lg bg-gradient-to-tr from-emerald-500 to-cyan-500 flex items-center justify-center text-zinc-950 font-black text-sm">
            ⚡
          </div>
          <h1 class="text-lg font-black tracking-tight text-white flex items-center gap-1.5">
            FITLOG <span class="text-xs px-2 py-0.5 rounded-full bg-emerald-950 text-emerald-400 border border-emerald-800/60 font-mono font-bold">MACHINE</span>
          </h1>
        </div>

        <!-- 실시간 스톱워치 -->
        <div class="flex items-center space-x-2">
          <div class="flex items-center space-x-1.5 bg-zinc-950 px-3 py-1.5 rounded-full border border-zinc-800">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
            <span id="header-stopwatch" class="font-mono text-xs font-bold text-zinc-200">00:00</span>
          </div>
        </div>
      </div>

      <!-- 상단 탭 3개 -->
      <div class="grid grid-cols-3 gap-1.5 mt-4 bg-zinc-950 p-1.5 rounded-2xl border border-zinc-800 text-xs">
        <button id="tab-btn-workout" onclick="switchMainTab('workout')" class="py-2.5 rounded-xl font-bold transition flex items-center justify-center gap-1 bg-emerald-500 text-zinc-950 shadow-md">
          🏋️ 오늘 운동
        </button>
        <button id="tab-btn-history" onclick="switchMainTab('history')" class="py-2.5 rounded-xl font-bold transition flex items-center justify-center gap-1 text-zinc-400 hover:text-white">
          📋 일지 (<span id="tab-hist-count">0</span>)
        </button>
        <button id="tab-btn-gemini" onclick="switchMainTab('gemini')" class="py-2.5 rounded-xl font-bold transition flex items-center justify-center gap-1 text-cyan-400 hover:text-cyan-300">
          ✨ AI 코칭
        </button>
      </div>
    </header>

    <!-- 탭 1: 오늘 운동 화면 -->
    <main id="tab-view-workout" class="p-4 space-y-4 flex-1">
      <!-- 실시간 통계 카드 -->
      <div class="grid grid-cols-3 gap-2 bg-gradient-to-br from-zinc-800/80 to-zinc-900 border border-zinc-700/60 rounded-2xl p-3.5 shadow-lg">
        <div class="text-center">
          <p class="text-[10px] font-bold text-zinc-400 uppercase">완료 총 볼륨</p>
          <div class="flex items-baseline justify-center gap-0.5 mt-0.5">
            <span id="stat-total-volume" class="text-xl font-black text-emerald-400 font-mono">0</span>
            <span class="text-[10px] text-zinc-400 font-bold">kg</span>
          </div>
        </div>
        <div class="text-center border-x border-zinc-700/50">
          <p class="text-[10px] font-bold text-zinc-400 uppercase">완료 세트</p>
          <p class="text-xl font-black text-zinc-100 font-mono mt-0.5" id="stat-completed-sets">0 / 0</p>
        </div>
        <div class="text-center">
          <p class="text-[10px] font-bold text-zinc-400 uppercase">소모 칼로리</p>
          <div class="flex items-baseline justify-center gap-0.5 mt-0.5">
            <span id="stat-calories" class="text-xl font-black text-amber-400 font-mono">0</span>
            <span class="text-[10px] text-zinc-400 font-bold">kcal</span>
          </div>
        </div>
      </div>

      <!-- 운동 카드 목록 렌더링 -->
      <div id="active-exercise-container" class="space-y-4"></div>

      <!-- 운동 종목 추가 버튼 -->
      <button onclick="openExerciseSelectorModal()" class="w-full py-4 rounded-2xl bg-zinc-900 border-2 border-dashed border-zinc-700/80 text-zinc-300 font-bold text-sm hover:border-emerald-500 hover:text-emerald-400 hover:bg-zinc-800/50 transition flex items-center justify-center gap-2">
        <span class="text-lg font-black">+</span> 새 운동 종목 추가하기
      </button>
    </main>

    <!-- 탭 2: 운동 일지 (히스토리) 화면 -->
    <main id="tab-view-history" class="p-4 space-y-4 flex-1 hidden">
      <div class="flex items-center justify-between px-1">
        <h2 class="text-sm font-extrabold text-zinc-200">누적 운동 일지</h2>
        <span class="text-[11px] text-zinc-500">기록이 브라우저에 자동 저장됩니다</span>
      </div>
      <div id="history-items-container" class="space-y-3"></div>
    </main>

    <!-- 탭 3: Gemini AI 코칭 화면 -->
    <main id="tab-view-gemini" class="p-4 space-y-4 flex-1 hidden">
      <div class="bg-gradient-to-br from-cyan-950/60 to-zinc-900 border border-cyan-800/60 rounded-2xl p-4 space-y-3">
        <div class="flex items-center gap-2">
          <span class="text-lg">🤖</span>
          <div>
            <h3 class="font-black text-white text-sm">Gemini AI 피트니스 코치</h3>
            <p class="text-[11px] text-cyan-300">오늘 수행한 머신 볼륨을 분석해 다음 증량 목표를 정해줍니다.</p>
          </div>
        </div>

        <!-- 코칭 페르소나 선택 -->
        <div>
          <label class="text-[11px] font-bold text-zinc-400 block mb-1.5">코칭 스타일 선택</label>
          <div class="grid grid-cols-2 gap-2 text-left">
            <button onclick="selectCoachPersona('coach')" id="persona-btn-coach" class="p-2.5 rounded-xl border bg-cyan-950 border-cyan-500 text-white">
              <p class="font-bold text-xs">🔥 빡센 관장님</p>
              <p class="text-[10px] text-zinc-400 mt-0.5">머신 증량 피드백 & 팩폭 점검</p>
            </button>
            <button onclick="selectCoachPersona('science')" id="persona-btn-science" class="p-2.5 rounded-xl border bg-zinc-950 border-zinc-800 text-zinc-400">
              <p class="font-bold text-xs">🩺 스포츠과학자</p>
              <p class="text-[10px] text-zinc-500 mt-0.5">상부 흉근 고립 & 볼륨 분석</p>
            </button>
            <button onclick="selectCoachPersona('friend')" id="persona-btn-friend" class="p-2.5 rounded-xl border bg-zinc-950 border-zinc-800 text-zinc-400">
              <p class="font-bold text-xs">💪 긍정 헬스메이트</p>
              <p class="text-[10px] text-zinc-500 mt-0.5">무한 칭찬 & 동기부여</p>
            </button>
            <button onclick="selectCoachPersona('diet')" id="persona-btn-diet" class="p-2.5 rounded-xl border bg-zinc-950 border-zinc-800 text-zinc-400">
              <p class="font-bold text-xs">🍗 영양 & 회복 코치</p>
              <p class="text-[10px] text-zinc-500 mt-0.5">운동 직후 단백질 식단 가이드</p>
            </button>
          </div>
        </div>

        <!-- 프롬프트 텍스트 에어리어 -->
        <div>
          <div class="flex items-center justify-between mb-1">
            <span class="text-[11px] font-bold text-zinc-400">자동 완성된 제미나이 프롬프트</span>
            <button onclick="copyGeminiPrompt()" class="text-[11px] font-bold text-cyan-400 hover:underline flex items-center gap-1">
              📋 프롬프트 복사
            </button>
          </div>
          <textarea id="gemini-prompt-box" rows="7" readonly class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 font-mono text-[11px] text-zinc-300 focus:outline-none resize-none leading-relaxed"></textarea>
        </div>

        <div class="grid grid-cols-2 gap-2 pt-1">
          <button onclick="copyGeminiPrompt()" class="py-3 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-zinc-950 font-black text-xs transition shadow-md flex items-center justify-center gap-1.5">
            📋 프롬프트 복사하기
          </button>
          <a href="https://gemini.google.com" target="_blank" class="py-3 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-white font-black text-xs transition flex items-center justify-center gap-1.5 border border-zinc-700">
            🚀 Gemini 바로가기 ↗
          </a>
        </div>
      </div>
    </main>

    <!-- 플로팅 휴식 타이머 -->
    <div id="floating-rest-bar" class="fixed bottom-24 left-1/2 -translate-x-1/2 w-full max-w-xl px-4 z-40 hidden">
      <div class="bg-emerald-950/95 border border-emerald-500/70 backdrop-blur-md rounded-2xl p-3.5 shadow-2xl flex items-center justify-between">
        <div class="flex items-center space-x-3">
          <div class="w-9 h-9 rounded-full bg-emerald-500/20 flex items-center justify-center text-emerald-400 font-black text-sm animate-spin">
            ⏳
          </div>
          <div>
            <p class="text-[11px] text-emerald-300 font-bold">세트 휴식 중</p>
            <p id="rest-timer-countdown" class="font-mono text-xl font-black text-white">60초</p>
          </div>
        </div>
        <div class="flex items-center space-x-2">
          <button onclick="adjustRestTimer(30)" class="px-2.5 py-1.5 rounded-lg bg-emerald-900/80 text-emerald-200 text-xs font-bold hover:bg-emerald-800">
            +30초
          </button>
          <button onclick="stopRestTimer()" class="px-2.5 py-1.5 rounded-lg bg-zinc-800 text-zinc-300 text-xs font-bold hover:bg-zinc-700">
            건너뛰기
          </button>
        </div>
      </div>
    </div>

    <!-- 하단 고정 완료 버튼 -->
    <footer id="bottom-workout-action" class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-xl p-4 bg-zinc-900/95 backdrop-blur-md border-t border-zinc-800 z-30">
      <button onclick="finishTodayWorkoutSession()" class="w-full py-4 rounded-2xl bg-emerald-500 hover:bg-emerald-400 text-zinc-950 font-black text-sm tracking-wide shadow-lg shadow-emerald-500/20 active:scale-[0.98] transition flex items-center justify-center gap-2">
        🏁 오늘 운동 완료 및 일지에 저장
      </button>
    </footer>

    <!-- 운동 종목 선택 모달 -->
    <div id="modal-exercise-selector" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center hidden">
      <div class="w-full max-w-xl bg-zinc-900 border border-zinc-800 rounded-t-3xl sm:rounded-3xl max-h-[88vh] flex flex-col overflow-hidden">
        
        <div class="p-4 border-b border-zinc-800 space-y-2.5">
          <div class="flex items-center justify-between">
            <h3 class="font-black text-white text-base">운동 선택</h3>
            <button onclick="closeExerciseSelectorModal()" class="text-zinc-500 hover:text-white p-1 text-lg">✕</button>
          </div>

          <div class="relative">
            <input type="text" id="picker-search-input" oninput="renderExercisePickerItems()" placeholder="운동 종목 검색 (예: 인클라인 머신, 랫풀다운)" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl pl-9 pr-4 py-2.5 text-xs text-white placeholder-zinc-500 focus:outline-none focus:border-emerald-500">
            <span class="absolute left-3 top-2.5 text-zinc-500 text-xs">🔍</span>
          </div>

          <!-- 부위 필터 태그 -->
          <div class="flex gap-1.5 overflow-x-auto pb-1 text-xs no-scrollbar">
            <button onclick="filterByPart('전체')" class="chip-part px-3 py-1 rounded-full font-bold bg-emerald-500 text-zinc-950 whitespace-nowrap" data-val="전체">전체</button>
            <button onclick="filterByPart('가슴')" class="chip-part px-3 py-1 rounded-full font-bold bg-zinc-800 text-zinc-400 whitespace-nowrap" data-val="가슴">가슴</button>
            <button onclick="filterByPart('등')" class="chip-part px-3 py-1 rounded-full font-bold bg-zinc-800 text-zinc-400 whitespace-nowrap" data-val="등">등</button>
            <button onclick="filterByPart('어깨')" class="chip-part px-3 py-1 rounded-full font-bold bg-zinc-800 text-zinc-400 whitespace-nowrap" data-val="어깨">어깨</button>
            <button onclick="filterByPart('하체')" class="chip-part px-3 py-1 rounded-full font-bold bg-zinc-800 text-zinc-400 whitespace-nowrap" data-val="하체">하체</button>
            <button onclick="filterByPart('팔')" class="chip-part px-3 py-1 rounded-full font-bold bg-zinc-800 text-zinc-400 whitespace-nowrap" data-val="팔">팔</button>
          </div>

          <!-- 기구 필터 태그 -->
          <div class="flex gap-1.5 overflow-x-auto pb-0.5 text-[11px] no-scrollbar">
            <button onclick="filterByEquip('전체')" class="chip-equip px-2.5 py-0.5 rounded-lg font-bold bg-zinc-200 text-zinc-950 whitespace-nowrap" data-val="전체">전체 장비</button>
            <button onclick="filterByEquip('머신')" class="chip-equip px-2.5 py-0.5 rounded-lg font-bold bg-zinc-800 text-zinc-400 whitespace-nowrap" data-val="머신">머신 전용</button>
            <button onclick="filterByEquip('케이블')" class="chip-equip px-2.5 py-0.5 rounded-lg font-bold bg-zinc-800 text-zinc-400 whitespace-nowrap" data-val="케이블">케이블</button>
            <button onclick="filterByEquip('바벨')" class="chip-equip px-2.5 py-0.5 rounded-lg font-bold bg-zinc-800 text-zinc-400 whitespace-nowrap" data-val="바벨">바벨/스미스</button>
            <button onclick="filterByEquip('덤벨')" class="chip-equip px-2.5 py-0.5 rounded-lg font-bold bg-zinc-800 text-zinc-400 whitespace-nowrap" data-val="덤벨">덤벨</button>
          </div>
        </div>

        <div id="picker-exercise-list" class="flex-1 overflow-y-auto p-4 space-y-2"></div>
      </div>
    </div>

    <!-- 토스트 알림 플로팅 -->
    <div id="toast-message" class="fixed top-6 left-1/2 -translate-x-1/2 bg-zinc-800 border border-zinc-700 text-white text-xs font-bold px-4 py-2.5 rounded-full shadow-2xl z-50 transition-all opacity-0 pointer-events-none duration-300">
      알림
    </div>

  </div>

  <!-- 핵심 자바스크립트 로직 -->
  <script>
    // --- 머신 중심의 풍부한 운동 데이터베이스 ---
    const BASE_EXERCISES = [
      // 가슴 (머신 우선)
      { id: 'machine_chest_press', name: '머신 체스트 프레스', part: '가슴', equip: '머신', target: '대흉근 전반 (중간 가슴)' },
      { id: 'incline_machine_press', name: '인클라인 머신 프레스', part: '가슴', equip: '머신', target: '쇄골두 (상부 윗가슴)' },
      { id: 'pec_deck_fly', name: '펙 덱 플라이 머신', part: '가슴', equip: '머신', target: '대흉근 안쪽 모아주기' },
      { id: 'smith_incline_press', name: '스미스머신 인클라인 벤치프레스', part: '가슴', equip: '바벨', target: '상부 가슴 고중량' },
      { id: 'bench_press', name: '바벨 벤치프레스', part: '가슴', equip: '바벨', target: '대흉근 전반' },

      // 등 (머신 & 케이블 우선)
      { id: 'lat_pulldown', name: '랫 풀 다운', part: '등', equip: '머신', target: '광배근 상부 (역삼각형)' },
      { id: 'cable_seated_row', name: '케이블 시티드 로우', part: '등', equip: '케이블', target: '광배근 중하부 및 등 두께' },
      { id: 'hammer_iso_row', name: '시티드 머신 로우', part: '등', equip: '머신', target: '등 중앙부' },
      { id: 'assisted_pullup', name: '어시스트 풀업 머신', part: '등', equip: '머신', target: '광배근 전체' },

      // 어깨 (머신 우선)
      { id: 'machine_shoulder_press', name: '머신 숄더 프레스', part: '어깨', equip: '머신', target: '전면/측면 삼각근' },
      { id: 'reverse_pec_deck', name: '리버스 펙 덱 플라이 (후면 머신)', part: '어깨', equip: '머신', target: '후면 삼각근' },
      { id: 'cable_lateral_raise', name: '케이블 사이드 레터럴 레이즈', part: '어깨', equip: '케이블', target: '측면 삼각근 지속 장력' },
      { id: 'db_lateral_raise', name: '덤벨 사이드 레터럴 레이즈', part: '어깨', equip: '덤벨', target: '측면 삼각근' },

      // 하체 (머신 우선)
      { id: 'leg_press', name: '파워 레그 프레스', part: '하체', equip: '머신', target: '대퇴사두근/둔근 고중량' },
      { id: 'leg_extension', name: '레그 익스텐션 머신', part: '하체', equip: '머신', target: '대퇴사두근 (허벅지 앞)' },
      { id: 'lying_leg_curl', name: '라잉 레그 컬 머신', part: '하체', equip: '머신', target: '햄스트링 (허벅지 뒤)' },
      { id: 'hip_abduction', name: '힙 어브덕션 머신', part: '하체', equip: '머신', target: '중둔근 (엉덩이 힙업)' },
      { id: 'squat', name: '바벨 백스쿼트', part: '하체', equip: '바벨', target: '하체 전신' },

      // 팔 (케이블/머신)
      { id: 'cable_pushdown', name: '케이블 삼두 푸시 다운', part: '팔', equip: '케이블', target: '삼두근 외측두' },
      { id: 'cable_curl', name: '케이블 바이셉스 컬', part: '팔', equip: '케이블', target: '이두근 봉긋한 자극' },
      { id: 'preacher_curl_machine', name: '프리처 컬 머신', part: '팔', equip: '머신', target: '이두근 고립' }
    ];

    const STORAGE_ACTIVE = 'fitlog_active_session_v3';
    const STORAGE_HIST = 'fitlog_history_records_v3';

    let appState = {
      stopwatchSeconds: 0,
      stopwatchActive: true,
      restSecondsLeft: 0,
      selectedPersona: 'coach',
      filterPart: '전체',
      filterEquip: '전체',
      history: [],
      currentSession: null
    };

    // 소리(비프음) 효과
    function playBeep() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.4);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.4);
      } catch (e) {}
    }

    function init() {
      // 히스토리 불러오기
      try {
        const hist = localStorage.getItem(STORAGE_HIST);
        appState.history = hist ? JSON.parse(hist) : [];
      } catch (e) {}

      // 진행 중인 운동 불러오기 (덤벨 대신 머신 체스트 프레스 + 인클라인 머신 프레스 기본 탑재)
      try {
        const active = localStorage.getItem(STORAGE_ACTIVE);
        if (active) {
          appState.currentSession = JSON.parse(active);
          appState.stopwatchSeconds = appState.currentSession.durationSeconds || 0;
        } else {
          appState.currentSession = {
            durationSeconds: 0,
            exercises: [
              {
                instanceId: 'inst_machine_1',
                name: '머신 체스트 프레스',
                part: '가슴',
                equip: '머신',
                sets: [
                  { weight: 40, reps: 12, completed: true },
                  { weight: 45, reps: 10, completed: true },
                  { weight: 50, reps: 8, completed: false }
                ]
              },
              {
                instanceId: 'inst_machine_2',
                name: '인클라인 머신 프레스',
                part: '가슴',
                equip: '머신',
                sets: [
                  { weight: 30, reps: 12, completed: true },
                  { weight: 35, reps: 10, completed: false },
                  { weight: 35, reps: 8, completed: false }
                ]
              }
            ]
          };
        }
      } catch (e) {
        appState.currentSession = { durationSeconds: 0, exercises: [] };
      }

      // 스톱워치 인터벌
      setInterval(() => {
        if (appState.stopwatchActive) {
          appState.stopwatchSeconds++;
          appState.currentSession.durationSeconds = appState.stopwatchSeconds;
          document.getElementById('header-stopwatch').innerText = formatTime(appState.stopwatchSeconds);
          updateSummaryStats();
          if (appState.stopwatchSeconds % 5 === 0) saveActive();
        }
      }, 1000);

      updateHistoryCount();
      renderActiveWorkoutCards();
      renderHistoryView();
      updateGeminiPromptBox();
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function saveActive() {
      try { localStorage.setItem(STORAGE_ACTIVE, JSON.stringify(appState.currentSession)); } catch (e) {}
    }
    function saveHistory() {
      try { localStorage.setItem(STORAGE_HIST, JSON.stringify(appState.history)); } catch (e) {}
      updateHistoryCount();
    }
    function updateHistoryCount() {
      document.getElementById('tab-hist-count').innerText = appState.history.length;
    }

    // 칼로리 계산 (현실적인 웨이트 트레이닝 METs 기준)
    function calculateRealCalories(seconds, volume) {
      if (seconds === 0 && volume === 0) return 0;
      const baseMins = seconds / 60;
      return Math.round((baseMins * 6.5) + ((volume / 1000) * 8));
    }

    function updateSummaryStats() {
      let volume = 0;
      let completedSets = 0;
      let totalSets = 0;

      appState.currentSession.exercises.forEach(ex => {
        ex.sets.forEach(s => {
          totalSets++;
          if (s.completed) {
            completedSets++;
            volume += (Number(s.weight) || 0) * (Number(s.reps) || 0);
          }
        });
      });

      document.getElementById('stat-total-volume').innerText = volume.toLocaleString();
      document.getElementById('stat-completed-sets').innerText = `${completedSets} / ${totalSets}`;
      document.getElementById('stat-calories').innerText = calculateRealCalories(appState.stopwatchSeconds, volume).toLocaleString();
    }

    function getLastRecordGhost(name) {
      for (const h of appState.history) {
        const match = h.exercises.find(e => e.name === name);
        if (match && match.sets) {
          const finished = match.sets.filter(s => s.completed);
          if (finished.length > 0) {
            const best = finished.reduce((p, c) => (c.weight > p.weight ? c : p), finished[0]);
            return `지난번 최고: ${best.weight}kg × ${best.reps}회`;
          }
        }
      }
      return '첫 도전 종목 (기록 시작)';
    }

    // 오늘 운동 화면 카드 렌더링
    function renderActiveWorkoutCards() {
      const container = document.getElementById('active-exercise-container');
      container.innerHTML = '';

      if (appState.currentSession.exercises.length === 0) {
        container.innerHTML = `
          <div class="text-center py-16 border-2 border-dashed border-zinc-800 rounded-3xl p-6">

            <p class="text-zinc-600 text-xs mt-1">아래 [새 운동 종목 추가하기]를 눌러 루틴을 시작하세요!</p>
          </div>
        `;
        updateSummaryStats();
        return;
      }

      appState.currentSession.exercises.forEach((ex, exIdx) => {
        const card = document.createElement('div');
        card.className = 'bg-zinc-900 border border-zinc-800 rounded-3xl p-4 shadow-sm';

        let setRows = '';
        ex.sets.forEach((set, sIdx) => {
          setRows += `
            <div class="grid grid-cols-12 items-center py-2 px-1 rounded-2xl transition ${set.completed ? 'bg-emerald-950/20 border border-emerald-900/40' : 'hover:bg-zinc-800/40'}">
              <span class="col-span-2 font-mono font-bold text-zinc-400 text-xs text-center">#${sIdx + 1}</span>

              <!-- 무게 조절 -->
              <div class="col-span-4 flex items-center justify-center space-x-1">
                <button onclick="changeVal(${exIdx}, ${sIdx}, 'weight', -5)" class="w-6 h-6 rounded-lg bg-zinc-800 text-zinc-400 hover:text-white font-bold text-xs">-</button>
                <input type="number" value="${set.weight}" onchange="setDirectVal(${exIdx}, ${sIdx}, 'weight', this.value)" class="w-10 bg-transparent text-center font-mono font-bold text-sm text-white focus:outline-none">
                <span class="text-[10px] text-zinc-500 font-bold -ml-1">kg</span>
                <button onclick="changeVal(${exIdx}, ${sIdx}, 'weight', 5)" class="w-6 h-6 rounded-lg bg-zinc-800 text-zinc-400 hover:text-white font-bold text-xs">+</button>
              </div>

              <!-- 횟수 조절 -->
              <div class="col-span-4 flex items-center justify-center space-x-1">
                <button onclick="changeVal(${exIdx}, ${sIdx}, 'reps', -1)" class="w-6 h-6 rounded-lg bg-zinc-800 text-zinc-400 hover:text-white font-bold text-xs">-</button>
                <input type="number" value="${set.reps}" onchange="setDirectVal(${exIdx}, ${sIdx}, 'reps', this.value)" class="w-8 bg-transparent text-center font-mono font-bold text-sm text-white focus:outline-none">
                <span class="text-[10px] text-zinc-500 font-bold -ml-1">회</span>
                <button onclick="changeVal(${exIdx}, ${sIdx}, 'reps', 1)" class="w-6 h-6 rounded-lg bg-zinc-800 text-zinc-400 hover:text-white font-bold text-xs">+</button>
              </div>

              <!-- 완료 체크 -->
              <div class="col-span-2 flex items-center justify-center space-x-1.5">
                <button onclick="toggleSetDone(${exIdx}, ${sIdx})" class="w-7 h-7 rounded-xl flex items-center justify-center transition-transform active:scale-90 ${set.completed ? 'bg-emerald-500 text-zinc-950 font-black' : 'bg-zinc-800 border border-zinc-700 text-transparent'}">
                  ✓
                </button>
                <button onclick="deleteSingleSet(${exIdx}, ${sIdx})" class="text-zinc-600 hover:text-red-400 text-xs px-1">✕</button>
              </div>
            </div>
          `;
        });

        card.innerHTML = `
          <div class="flex items-start justify-between pb-3 border-b border-zinc-800">
            <div>
              <div class="flex items-center gap-2">
                <span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-emerald-950 text-emerald-400 border border-emerald-800/40">${ex.equip || '머신'}</span>
                <h3 class="font-bold text-white text-base">${ex.name}</h3>
              </div>
              <p class="text-[11px] text-zinc-400 mt-1 flex items-center gap-1">
                <span>💡</span> ${getLastRecordGhost(ex.name)}
              </p>
            </div>
            <button onclick="deleteExerciseCard(${exIdx})" class="text-zinc-500 hover:text-red-400 p-1 text-xs" title="종목 삭제">
              🗑️
            </button>
          </div>

          <div class="grid grid-cols-12 text-[10px] font-bold text-zinc-500 pt-3 pb-1 text-center">
            <span class="col-span-2">세트</span>
            <span class="col-span-4">무게</span>
            <span class="col-span-4">횟수</span>
            <span class="col-span-2">완료</span>
          </div>

          <div class="space-y-1.5 mt-1">${setRows}</div>

          <div class="grid grid-cols-2 gap-2 mt-3 pt-2.5 border-t border-zinc-800/60">
            <button onclick="addNewSet(${exIdx})" class="py-2 rounded-xl bg-zinc-800/70 hover:bg-zinc-800 text-emerald-400 text-xs font-bold transition flex items-center justify-center gap-1">
              + 세트 추가
            </button>
            <button onclick="duplicateLastSet(${exIdx})" class="py-2 rounded-xl bg-zinc-800/70 hover:bg-zinc-800 text-zinc-300 text-xs font-bold transition flex items-center justify-center gap-1">
              📑 세트 복제
            </button>
          </div>
        `;
        container.appendChild(card);
      });

      updateSummaryStats();
      saveActive();
    }

    function changeVal(exIdx, sIdx, field, delta) {
      const cur = Number(appState.currentSession.exercises[exIdx].sets[sIdx][field]) || 0;
      appState.currentSession.exercises[exIdx].sets[sIdx][field] = Math.max(field === 'weight' ? 0 : 1, cur + delta);
      renderActiveWorkoutCards();
    }

    function setDirectVal(exIdx, sIdx, field, val) {
      appState.currentSession.exercises[exIdx].sets[sIdx][field] = Math.max(field === 'weight' ? 0 : 1, Number(val) || 0);
      renderActiveWorkoutCards();
    }

    function toggleSetDone(exIdx, sIdx) {
      const target = appState.currentSession.exercises[exIdx].sets[sIdx];
      target.completed = !target.completed;
      if (target.completed) {
        startRestTimer(60);
        showToast('세트 완료! 60초 휴식 시작 🔥');
      }
      renderActiveWorkoutCards();
    }

    function addNewSet(exIdx) {
      const sets = appState.currentSession.exercises[exIdx].sets;
      const last = sets[sets.length - 1];
      sets.push({ weight: last ? last.weight : 30, reps: last ? last.reps : 10, completed: false });
      renderActiveWorkoutCards();
    }

    function duplicateLastSet(exIdx) {
      const sets = appState.currentSession.exercises[exIdx].sets;
      const last = sets[sets.length - 1];
      sets.push({ weight: last ? last.weight : 30, reps: last ? last.reps : 10, completed: false });
      renderActiveWorkoutCards();
      showToast('마지막 세트가 복제되었습니다.');
    }

    function deleteSingleSet(exIdx, sIdx) {
      const sets = appState.currentSession.exercises[exIdx].sets;
      if (sets.length <= 1) {
        showToast('최소 1개 세트는 유지되어야 합니다.');
        return;
      }
      sets.splice(sIdx, 1);
      renderActiveWorkoutCards();
    }

    function deleteExerciseCard(exIdx) {
      const name = appState.currentSession.exercises[exIdx].name;
      if (confirm(`'${name}' 종목을 삭제하시겠습니까?`)) {
        appState.currentSession.exercises.splice(exIdx, 1);
        renderActiveWorkoutCards();
        showToast('종목이 삭제되었습니다.');
      }
    }

    // 휴식 타이머
    let restTimerInterval = null;
    function startRestTimer(sec) {
      clearInterval(restTimerInterval);
      appState.restSecondsLeft = sec;
      const bar = document.getElementById('floating-rest-bar');
      bar.classList.remove('hidden');
      updateRestCountdownText();

      restTimerInterval = setInterval(() => {
        appState.restSecondsLeft--;
        if (appState.restSecondsLeft <= 0) {
          stopRestTimer();
          playBeep();
          showToast('⏰ 휴식 종료! 다음 세트 들어갑시다!');
        } else {
          updateRestCountdownText();
        }
      }, 1000);
    }
    function updateRestCountdownText() {
      document.getElementById('rest-timer-countdown').innerText = `${appState.restSecondsLeft}초`;
    }
    function adjustRestTimer(delta) {
      appState.restSecondsLeft = Math.max(0, appState.restSecondsLeft + delta);
      updateRestCountdownText();
    }
    function stopRestTimer() {
      clearInterval(restTimerInterval);
      document.getElementById('floating-rest-bar').classList.add('hidden');
    }

    // 운동 선택 모달 (머신 최우선 정렬)
    function openExerciseSelectorModal() {
      document.getElementById('modal-exercise-selector').classList.remove('hidden');
      renderExercisePickerItems();
    }
    function closeExerciseSelectorModal() {
      document.getElementById('modal-exercise-selector').classList.add('hidden');
    }

    function filterByPart(part) {
      appState.filterPart = part;
      document.querySelectorAll('.chip-part').forEach(c => {
        if (c.getAttribute('data-val') === part) {
          c.className = 'chip-part px-3 py-1 rounded-full font-bold bg-emerald-500 text-zinc-950 whitespace-nowrap';
        } else {
          c.className = 'chip-part px-3 py-1 rounded-full font-bold bg-zinc-800 text-zinc-400 whitespace-nowrap';
        }
      });
      renderExercisePickerItems();
    }

    function filterByEquip(equip) {
      appState.filterEquip = equip;
      document.querySelectorAll('.chip-equip').forEach(c => {
        if (c.getAttribute('data-val') === equip) {
          c.className = 'chip-equip px-2.5 py-0.5 rounded-lg font-bold bg-zinc-200 text-zinc-950 whitespace-nowrap';
        } else {
          c.className = 'chip-equip px-2.5 py-0.5 rounded-lg font-bold bg-zinc-800 text-zinc-400 whitespace-nowrap';
        }
      });
      renderExercisePickerItems();
    }

    function renderExercisePickerItems() {
      const q = (document.getElementById('picker-search-input').value || '').toLowerCase().trim();
      const container = document.getElementById('picker-exercise-list');
      container.innerHTML = '';

      const filtered = BASE_EXERCISES.filter(item => {
        const matchQ = item.name.toLowerCase().includes(q) || (item.target && item.target.toLowerCase().includes(q));
        const matchPart = appState.filterPart === '전체' || item.part === appState.filterPart;
        const matchEquip = appState.filterEquip === '전체' || item.equip === appState.filterEquip;
        return matchQ && matchPart && matchEquip;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div class="text-center py-10 text-zinc-500 text-xs">해당하는 운동 종목이 없습니다.</div>`;
        return;
      }

      filtered.forEach(item => {
        const el = document.createElement('div');
        el.className = 'p-3.5 bg-zinc-950 border border-zinc-800/80 rounded-2xl hover:border-emerald-500/60 cursor-pointer flex items-center justify-between transition';
        el.onclick = () => {
          appState.currentSession.exercises.push({
            instanceId: 'inst_' + Date.now(),
            name: item.name,
            part: item.part,
            equip: item.equip,
            sets: [
              { weight: 30, reps: 10, completed: false },
              { weight: 30, reps: 10, completed: false },
              { weight: 30, reps: 10, completed: false }
            ]
          });
          closeExerciseSelectorModal();
          renderActiveWorkoutCards();
          showToast(`'${item.name}' 추가 완료!`);
        };

        el.innerHTML = `
          <div>
            <div class="flex items-center gap-2">
              <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-zinc-800 text-zinc-400">${item.equip}</span>
              <span class="font-bold text-sm text-zinc-100">${item.name}</span>
            </div>
            <p class="text-[11px] text-zinc-500 mt-1">부위: ${item.part} · ${item.target}</p>
          </div>
          <span class="text-xs font-bold text-emerald-400 bg-emerald-950/80 px-3 py-1.5 rounded-xl border border-emerald-800/40">
            선택 +
          </span>
        `;
        container.appendChild(el);
      });
    }

    // 오늘 운동 완료 & 일지 저장
    function finishTodayWorkoutSession() {
      if (appState.currentSession.exercises.length === 0) {
        showToast('저장할 운동이 없습니다.');
        return;
      }

      let volume = 0;
      let completedCount = 0;
      appState.currentSession.exercises.forEach(ex => {
        ex.sets.forEach(s => {
          if (s.completed) {
            completedCount++;
            volume += (Number(s.weight) || 0) * (Number(s.reps) || 0);
          }
        });
      });

      if (completedCount === 0) {
        if (!confirm('완료 체크(✓)된 세트가 없습니다. 그래도 오늘 운동을 저장할까요?')) return;
      }

      const now = new Date();
      const days = ['일', '월', '화', '수', '목', '금', '토'];
      const dateFormatted = `${now.getFullYear()}.${now.getMonth() + 1}.${now.getDate()} (${days[now.getDay()]}) ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

      const historyRecord = {
        id: 'hist_' + Date.now(),
        date: dateFormatted,
        durationSeconds: appState.stopwatchSeconds,
        durationText: formatTime(appState.stopwatchSeconds),
        totalVolume: volume,
        calories: calculateRealCalories(appState.stopwatchSeconds, volume),
        exercises: JSON.parse(JSON.stringify(appState.currentSession.exercises))
      };

      appState.history.unshift(historyRecord);
      saveHistory();

      // 세션 초기화
      appState.stopwatchSeconds = 0;
      appState.currentSession = { durationSeconds: 0, exercises: [] };
      saveActive();

      showToast('🎉 오늘 운동이 성공적으로 일지에 저장되었습니다!');
      switchMainTab('history');
    }

    // 히스토리 뷰 렌더링
    function renderHistoryView() {
      const container = document.getElementById('history-items-container');
      container.innerHTML = '';

      if (appState.history.length === 0) {
        container.innerHTML = `
          <div class="text-center py-20 border border-zinc-800 rounded-3xl p-6">
            <p class="text-zinc-400 text-sm font-bold">저장된 운동 일지가 없습니다.</p>
            <p class="text-zinc-600 text-xs mt-1">오늘 운동을 마치고 하단 [완료] 버튼을 누르면 기록돼요!</p>
          </div>
        `;
        return;
      }

      appState.history.forEach((h, hIdx) => {
        const item = document.createElement('div');
        item.className = 'bg-zinc-900 border border-zinc-800 rounded-3xl p-4 space-y-3';

        let exListHtml = '';
        h.exercises.forEach(ex => {
          let setBadges = '';
          ex.sets.forEach(s => {
            setBadges += `
              <span class="text-[10px] px-2 py-0.5 rounded-md font-mono ${s.completed ? 'bg-zinc-800 text-emerald-400 border border-zinc-700' : 'bg-zinc-950 text-zinc-600 line-through'}">
                ${s.weight}kg×${s.reps}
              </span>
            `;
          });
          exListHtml += `
            <div class="text-xs pt-1.5 first:pt-0">
              <div class="font-bold text-zinc-200 flex items-center justify-between">
                <span>${ex.name}</span>
                <span class="text-[10px] text-zinc-500 font-normal">${ex.sets.length}세트</span>
              </div>
              <div class="flex flex-wrap gap-1.5 mt-1.5">${setBadges}</div>
            </div>
          `;
        });

        item.innerHTML = `
          <div class="flex items-center justify-between">
            <div>
              <h4 class="font-black text-white text-sm">${h.date}</h4>
              <p class="text-[11px] text-zinc-400 mt-0.5">
                시간: <span class="text-zinc-300 font-mono font-bold">${h.durationText}</span> · 
                볼륨: <span class="text-emerald-400 font-bold">${h.totalVolume.toLocaleString()} kg</span> · 
                칼로리: <span class="text-amber-400 font-bold">${h.calories} kcal</span>
              </p>
            </div>
            <button onclick="deleteHistoryRecord(${hIdx})" class="text-zinc-600 hover:text-red-400 p-1 text-xs">삭제</button>
          </div>
          <div class="bg-zinc-950/70 rounded-2xl p-3 space-y-1.5 border border-zinc-800/60">${exListHtml}</div>
        `;
        container.appendChild(item);
      });
    }

    function deleteHistoryRecord(idx) {
      if (confirm('이 운동 일지를 삭제하시겠습니까?')) {
        appState.history.splice(idx, 1);
        saveHistory();
        renderHistoryView();
        showToast('일지가 삭제되었습니다.');
      }
    }

    // Gemini AI 프롬프트 생성 로직
    function selectCoachPersona(persona) {
      appState.selectedPersona = persona;
      ['coach', 'science', 'friend', 'diet'].forEach(p => {
        const btn = document.getElementById('persona-btn-' + p);
        if (p === persona) {
          btn.className = 'p-2.5 rounded-xl border bg-cyan-950 border-cyan-500 text-white';
        } else {
          btn.className = 'p-2.5 rounded-xl border bg-zinc-950 border-zinc-800 text-zinc-400';
        }
      });
      updateGeminiPromptBox();
    }

    function updateGeminiPromptBox() {
      const personas = {
        coach: '너는 20년 경력의 보디빌딩 관장님이야. 빡세고 묵직하지만 정확하게 타겟 부위 자극과 머신 증량 루틴을 피드백해줘.',
        science: '너는 스포츠의학 및 생체역학 전문가야. 인클라인 머신 각도와 상부 흉근 고립도, 세트 볼륨을 해부학적으로 분석해줘.',
        friend: '너는 언제나 동기부여를 심어주는 파이팅 넘치는 긍정 헬스 메이트야. 오늘 머신으로 털어버린 노력을 칭찬해주고 꿀팁을 전수해줘.',
        diet: '너는 피트니스 전문 영양 코치야. 오늘 수행한 가슴 고립 운동 강도에 맞춰 운동 직후 단백질 섭취 타이밍과 식단을 설계해줘.'
      };

      const source = (appState.currentSession && appState.currentSession.exercises.length > 0)
        ? appState.currentSession
        : (appState.history[0] || null);

      if (!source) {
        document.getElementById('gemini-prompt-box').value = '기록된 운동이 없습니다. 먼저 오늘 운동을 진행해 주세요!';
        return;
      }

      let exDetail = '';
      let vol = 0;
      source.exercises.forEach((ex, idx) => {
        exDetail += `\n${idx + 1}. ${ex.name} (${ex.equip || '머신'} / ${ex.part || '가슴'}):\n`;
        ex.sets.forEach((s, sIdx) => {
          if (s.completed) vol += (Number(s.weight) || 0) * (Number(s.reps) || 0);
          exDetail += `   - ${sIdx + 1}세트: ${s.weight}kg × ${s.reps}회 ${s.completed ? '(성공)' : '(미완료)'}\n`;
        });
      });

      const prompt = `[역할 설정]\n${personas[appState.selectedPersona]}\n\n` +
        `[오늘의 운동 수행 데이터]\n` +
        `- 총 운동 시간: ${formatTime(source.durationSeconds || appState.stopwatchSeconds)}\n` +
        `- 총 볼륨 합산: ${vol.toLocaleString()} kg\n` +
        `- 수행 종목 및 세트 디테일:${exDetail || '\n없음'}\n\n` +
        `[질문 및 요청 사항]\n` +
        `1. 오늘 진행한 머신 종목들의 볼륨과 윗가슴/가슴 전반의 자극 강도가 적절했는지 분석해줘.\n` +
        `2. 점진적 과부하를 위해 다음 세션에서 인클라인 머신 및 체스트 프레스 무게를 몇 kg 올려 도전하면 좋을지 알려줘.\n` +
        `3. 운동 직후 최적의 단백질 섭취량과 흡수를 돕는 식단 팁을 줘.`;

      document.getElementById('gemini-prompt-box').value = prompt;
    }

    function copyGeminiPrompt() {
      const box = document.getElementById('gemini-prompt-box');
      box.select();
      navigator.clipboard.writeText(box.value);
      showToast('📋 Gemini 프롬프트가 복사되었습니다!');
    }

    // 탭 전환
    function switchMainTab(tab) {
      const wView = document.getElementById('tab-view-workout');
      const hView = document.getElementById('tab-view-history');
      const gView = document.getElementById('tab-view-gemini');
      const footer = document.getElementById('bottom-workout-action');

      const btnW = document.getElementById('tab-btn-workout');
      const btnH = document.getElementById('tab-btn-history');
      const btnG = document.getElementById('tab-btn-gemini');

      wView.classList.add('hidden');
      hView.classList.add('hidden');
      gView.classList.add('hidden');
      footer.classList.add('hidden');

      btnW.className = 'py-2.5 rounded-xl font-bold transition flex items-center justify-center gap-1 text-zinc-400 hover:text-white';
      btnH.className = 'py-2.5 rounded-xl font-bold transition flex items-center justify-center gap-1 text-zinc-400 hover:text-white';
      btnG.className = 'py-2.5 rounded-xl font-bold transition flex items-center justify-center gap-1 text-zinc-400 hover:text-white';

      if (tab === 'workout') {
        wView.classList.remove('hidden');
        footer.classList.remove('hidden');
        btnW.className = 'py-2.5 rounded-xl font-bold transition flex items-center justify-center gap-1 bg-emerald-500 text-zinc-950 shadow-md';
      } else if (tab === 'history') {
        hView.classList.remove('hidden');
        btnH.className = 'py-2.5 rounded-xl font-bold transition flex items-center justify-center gap-1 bg-emerald-500 text-zinc-950 shadow-md';
        renderHistoryView();
      } else if (tab === 'gemini') {
        gView.classList.remove('hidden');
        btnG.className = 'py-2.5 rounded-xl font-bold transition flex items-center justify-center gap-1 bg-cyan-500 text-zinc-950 shadow-md';
        updateGeminiPromptBox();
      }
    }

    function showToast(msg) {
      const t = document.getElementById('toast-message');
      t.innerText = msg;
      t.classList.remove('opacity-0', 'pointer-events-none');
      setTimeout(() => {
        t.classList.add('opacity-0', 'pointer-events-none');
      }, 2500);
    }

    // 앱 실행
    init();
  </script>
</body>
</html>
